name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      # research/** 是策略口径与影子账户引擎的所在地（paper_*.py / shortline_*.py）。
      # 不加这一条，纯研究代码改动能零 CI 合进 main —— 今天 #579/#580/#583
      # 全靠同时改了 tests/** 才被 CI 拦住，下次有人只改研究代码就会漏。
      - "research/**"
      - "tests/**"
      - "backend/**"
      - "frontend/**"
      # config/ 是被代码消费的：thresholds.yaml 驱动策略阈值（AGENTS §3.5 要求改它必须
      # 升 version 并附说明），data_sources.yaml 驱动 source_catalog 的校验。
      # 有 11 个测试文件读这两个文件 —— 不加这一条，纯 config 改动能零 CI 合进 main。
      - "config/**"
      - "deploy/baota/**"
      - "deploy/nginx/**"
      - "deploy/systemd/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "codex/**"
      - "test/**"
    paths:
      - "src/**"
      - "scripts/**"
      # research/** 是策略口径与影子账户引擎的所在地（paper_*.py / shortline_*.py）。
      # 不加这一条，纯研究代码改动能零 CI 合进 main —— 今天 #579/#580/#583
      # 全靠同时改了 tests/** 才被 CI 拦住，下次有人只改研究代码就会漏。
      - "research/**"
      - "tests/**"
      - "backend/**"
      - "frontend/**"
      - "config/**"
      - "deploy/baota/**"
      - "deploy/nginx/**"
      - "deploy/systemd/**"
      - "pyproject.toml"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: verify (shard ${{ matrix.shard }})
    # 🔴 显式钉住时区：GitHub runner 目前默认就是 UTC，但那只是镜像的默认值、不是契约。
    # 时点类断言必须在「非东八区」下求值才有意义 —— 后端禁裸 `datetime.now()`（必须走
    # `now_shanghai()`），前端日期格式化必须固定 `timeZone: "Asia/Shanghai"`，而 runner
    # 本身就是 UTC。不写死的话，镜像哪天改成别的时区，这批断言会静默变成恒真。
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Upload preflight
        run: python3 -m scripts.preflight_upload

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,dev,web,api]"

      - name: Ruff
        run: ruff check .

      - name: Frontend build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # 契约断言必须进 CI：这些 *.test.ts 曾只被 tsc 做类型检查、布尔表达式从未求值，
      # 看着像测试实际不验证任何东西，项目 IA 漂移就是这样漏过去的。放在 build 之后
      # 复用已装好的 node_modules。
      #
      # 🔴 两遍不同时区，缺一不可：
      # - `UTC`：抓「拿本地时区当北京时间」的那一类（#645 就是这么漏的 —— 本机
      #   TZ=Asia/Shanghai 下测试全绿，只有 UTC 下才转红）；
      # - `Asia/Shanghai`：抓反方向 —— 把「北京时区」写死在断言里、在真实东八区用户
      #   那边才成立的用例。
      # 两个环境各自只能覆盖一半，所以必须都跑。
      - name: Frontend contracts (UTC)
        run: npm test --prefix frontend

      - name: Frontend contracts (Asia/Shanghai)
        run: npm test --prefix frontend
        env:
          TZ: Asia/Shanghai

      - name: Check AQSP deployment bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          bundle = root / "frontend" / "dist" / "index.html"
          html = bundle.read_text(encoding="utf-8")
          assert "AQSP" in html, "frontend bundle is missing the AQSP entry"
          assert any((bundle.parent / "assets").iterdir()), "frontend bundle has no assets"

          api_service = (root / "deploy/systemd/aqsp-vibe-research-api.service").read_text(encoding="utf-8")
          preview_service = (root / "deploy/systemd/aqsp-vibe-research-preview.service").read_text(encoding="utf-8")
          nginx = (root / "deploy/nginx/vibe-research-mainline.conf").read_text(encoding="utf-8")
          env = (root / "deploy/systemd/aqsp-vibe-research.env.example").read_text(encoding="utf-8")

          assert "-m uvicorn app:app --host 127.0.0.1 --port 8900" in api_service
          assert "run preview -- --host 127.0.0.1 --port 5899 --strictPort" in preview_service
          assert "VIBE_RESEARCH_BACKEND_PORT=8900" in env
          assert "VIBE_RESEARCH_FRONTEND_PORT=5899" in env
          assert "proxy_pass http://127.0.0.1:8900" in nginx
          assert "proxy_pass http://127.0.0.1:5899" in nginx
          assert "location = /api/health" in nginx
          print(f"validated static entry: {bundle}")
          print("validated AQSP API 127.0.0.1:8900 and frontend 127.0.0.1:5899")
          PY

      - name: Tests
        env:
          PYTHONFAULTHANDLER: "1"
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_TOTAL_SHARDS: 4
        run: |
          python3 -m pytest --collect-only -q -m "not live" tests backend/tests > /tmp/aqsp-all-test-nodes.txt
          python3 scripts/check_capability_retention.py --collected-tests /tmp/aqsp-all-test-nodes.txt
          python3 - <<'PY' > /tmp/aqsp-test-nodes.txt
          import os
          from pathlib import Path

          shard = int(os.environ["PYTEST_SHARD"])
          total = int(os.environ["PYTEST_TOTAL_SHARDS"])
          lines = [
              line.strip()
              for line in Path("/tmp/aqsp-all-test-nodes.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if "::" in line
          ]
          print("\n".join(line for index, line in enumerate(lines) if index % total == shard))
          PY
          TEST_NODES=()
          while IFS= read -r node; do
            [[ -n "${node}" ]] && TEST_NODES+=("${node}")
          done < /tmp/aqsp-test-nodes.txt
          pytest -q -vv -m "not live" --durations=20 -o faulthandler_timeout=120 "${TEST_NODES[@]}"

      - name: Secret scan
        run: python3 scripts/check_no_secrets.py .
