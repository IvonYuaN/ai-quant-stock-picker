<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQSP · 量化选股研究工作台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="description" content="AQSP 量化选股研究工作台，集中查看每日结论、候选依据、消息证据与讨论复核。" />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root">
      <main class="aqsp-static-fallback" aria-live="polite">
        <p>AQSP · 研究快照</p>
        <h1>正在加载当天研究</h1>
        <div id="aqsp-static-status">正在读取真实候选、变体与数据门禁。</div>
      </main>
    </div>
    <script>
      (() => {
        const status = document.getElementById("aqsp-static-status");
        if (!status) return;
        fetch("/api/aqsp/snapshot")
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then((payload) => {
            const data = payload && typeof payload === "object" && payload.data ? payload.data : payload;
            const candidates = Array.isArray(data?.candidates) ? data.candidates.length : 0;
            const variants = Array.isArray(data?.variants) ? data.variants.length : 0;
            const reason = data?.recommendation_gate?.reasons?.[0] || "等待正式任务产出";
            status.textContent = `${data?.selected_date || "日期未记录"}：候选 ${candidates}，变体 ${variants}。${reason}`;
          })
          .catch(() => {
            status.textContent = "研究快照暂时无法读取，请刷新后重试。";
          });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
