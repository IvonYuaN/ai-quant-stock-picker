name: Monitor
on:
  schedule:
    - cron: '*/30 * * * *'  # 北京时间每30分钟
  workflow_dispatch:

concurrency:
  group: monitor-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[data]"
      # 本 workflow 是“冒烟测试”：GitHub Actions 运行器无持久 data/，
      # 数据依赖型检查会标记为 skipped（不产出业务结论）。
      # --allow-skipped 显式声明本次不做业务判定，避免“零监控=健康”的假绿。
      # 权威监控与告警推送由生产服务器 cron（install_server_cron.sh，
      # 命令 `aqsp monitor --notify`）承载，详见 docs/monitoring-boundary.md。
      - run: aqsp monitor --allow-skipped
