# AQSP 双服务器分离部署 Nginx 配置
# 适用场景：前端服务器和数据服务器分离部署
# 前端服务器使用本配置，将 API 请求代理到远程数据服务器

# 使用方法：
# 1. 复制本文件到宝塔面板配置目录：
#    /www/server/panel/vhost/nginx/proxy/lh.ifidy.cn/aqsp-dashboard-dual-server.conf
# 2. 修改下方 upstream 配置中的 DATA_SERVER_IP 为实际数据服务器地址
# 3. 测试配置：/www/server/nginx/sbin/nginx -t
# 4. 重载 Nginx：/etc/init.d/nginx reload

# ============================================================
# 数据服务器配置（必须修改）
# ============================================================
upstream aqsp_backend {
    # 替换为数据服务器的实际地址
    # 内网访问（推荐）: server 10.0.1.100:8900;
    # 公网访问: server data.yourdomain.com:8900;
    server DATA_SERVER_IP:8900;

    keepalive 32;
    keepalive_timeout 60s;
}

# ============================================================
# API 请求代理到数据服务器
# ============================================================

# 健康检查端点（无鉴权，快速响应）
location = /api/health {
    proxy_pass http://aqsp_backend/api/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering off;
    proxy_cache off;

    # 健康检查结果可短时间缓存
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# API 根路径
location = /api {
    proxy_pass http://aqsp_backend/api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;

    proxy_buffering off;
    proxy_cache off;
}

# 所有 API 请求（主要路由）
location ^~ /api/ {
    proxy_pass http://aqsp_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 重要：传递认证信息
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;

    # WebSocket 支持（为未来功能预留）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 超时配置（数据查询可能较慢）
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # 流式响应支持（AI 对话等）
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;

    # 错误处理
    proxy_intercept_errors off;
}

# ============================================================
# 前端资源走本地服务
# ============================================================

# 静态资源（构建产物）
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:5899;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_cache off;

    # 静态资源可以缓存
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600" always;
}

# ============================================================
# 历史路径重定向
# ============================================================

# 旧 Dashboard 路径重定向到新入口
location ~ ^/(?:dist/)?dashboard(?:/|$|\.html$) {
    return 302 /$is_args$args;
}

# 旧初学者和 Agent 页面重定向
location ~ ^/(?:beginner|agent|agents|dashboard_beginner)(?:/|$|\.html$|\.py$) {
    return 302 /$is_args$args;
}

# 归档页面重定向
location = /archive.html {
    return 302 /$is_args$args;
}

# ============================================================
# React 前端应用（所有其他路由）
# ============================================================

location / {
    proxy_pass http://127.0.0.1:5899;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_cache off;

    # React Router 支持（所有路由都返回 index.html）
    proxy_intercept_errors on;
    error_page 404 =200 /index.html;

    # index.html 不缓存，确保总是最新版本
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# ============================================================
# WebSocket 升级支持（全局配置）
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ============================================================
# 安全和性能配置
# ============================================================

# 隐藏 Nginx 版本号
server_tokens off;

# 防止点击劫持
add_header X-Frame-Options "SAMEORIGIN" always;

# XSS 防护
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

# HSTS（如果使用 HTTPS）
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
