# 监控配置 — 版本与运行边界说明
#
# 运行边界（重要）：
# - GitHub Actions 上的 `aqsp monitor` 是“冒烟测试”：运行环境无持久 data/，
#   所有数据依赖型检查会被标记为 `skipped`（跳过），不产生业务结论。
#   因此 CI 必须加 `--allow-skipped`，否则会因“零监控”而失败（假绿防护）。
# - 生产环境的权威监控由 `scripts/server_monitor.sh`（BT 计划任务每 15 分钟）
#   承载：渲染时通过 envsubst 把 `${AQSP_RUNTIME_DATA_ROOT}` 注入字面量，让 yaml
#   中的 `cache_path`/`ledger_path` 等解析到真实 runtime data 目录。
#   最终以 `aqsp monitor --notify` 推送告警（`AQSP_MONITOR_NOTIFY=true` 启用）。
# - `skipped` 绝不等于“健康”。被跳过仅代表“本次因数据不可用无法评估”，
#   调用方（cli.run_monitor）会显式暴露被跳过的数量，CI/观察者不得据此判定系统正常。
#
# 数据依赖型检查的 `required` 语义：
# - required: false → 目标文件缺失时标记为 skipped（CI/无数据环境预期如此）。
# - required: true  → 目标文件缺失时按真实故障处理（triggered=True）。
#   当前各项均为 false，以保证无数据 CI 稳定；生产环境若希望把“缓存缺失”
#   当作严重故障，可在服务器侧使用覆盖配置并将对应项设为 required: true。
#
# 路径变量约定（PR #77）：
# - yaml 中所有 `data/...` 字面量改为 `${AQSP_RUNTIME_DATA_ROOT}/...`，
#   由 `scripts/server_monitor.sh` 在执行 `aqsp monitor --config ...` 之前
#   envsubst 渲染到临时副本（自动 trap cleanup）。
# - CI 直接消费 yaml 时，未声明的 `${AQSP_RUNTIME_DATA_ROOT}` 替换为空，
#   `cache_path.exists()` 仍走 skipped 分支，行为兼容（PR #77 修复前也是 skipped）。
version: "1.3.0"
monitors:
  - name: "stale_data"
    description: "数据滞后超过阈值"
    enabled: true
    check: "data_freshness"
    params:
      cache_path: ${AQSP_RUNTIME_DATA_ROOT}/cache.db
      max_lag_days: 3
      # CI 无持久 data/，缓存缺失是预期现象 → 标记 skipped 而非误报。
      # 生产环境 data/cache.db 由数据刷新流水线维护，缓存存在时仍会校验新鲜度。
      required: false
    severity: "critical"

  - name: "circuit_breaker"
    description: "组合熔断触发"
    enabled: true
    check: "circuit_breaker"
    params: {}
    severity: "critical"

  - name: "win_rate_drop"
    description: "胜率异常下降"
    enabled: true
    check: "win_rate"
    params:
      min_win_rate: 0.3
      min_samples: 10
    severity: "warning"

  - name: "data_source_failure"
    description: "数据源连续失败"
    enabled: true
    check: "source_health"
    params:
      max_consecutive_failures: 3
    severity: "critical"

  - name: "walkforward_runtime"
    description: "walk-forward 生产自评估状态"
    enabled: true
    check: "walkforward_runtime"
    params:
      gate_path: ${AQSP_RUNTIME_DATA_ROOT}/walkforward_gate.json
      status_path: ${AQSP_RUNTIME_DATA_ROOT}/walkforward_production_status.json
      max_age_days: 35
      # gate 缺失在 CI 中标记 skipped（见 checker._check_walkforward_runtime）；
      # 生产环境 gate 由流水线写入，存在时过期/未完成逻辑照常触发。
    severity: "critical"

  - name: "screening_liveness"
    description: "筛选心跳：最近一次筛选是否停更（cron/流水线存活）"
    enabled: true
    check: "screening_liveness"
    params:
      ledger_path: ${AQSP_RUNTIME_DATA_ROOT}/predictions.jsonl
      max_staleness_trading_days: 2
    severity: "critical"

  - name: "empty_picks"
    description: "最近一次筛选未产出可交易标的却未报警"
    enabled: true
    check: "empty_picks"
    params:
      ledger_path: ${AQSP_RUNTIME_DATA_ROOT}/predictions.jsonl
      paper_ledger_path: ${AQSP_RUNTIME_DATA_ROOT}/paper_trades.jsonl
    severity: "warning"

  - name: "daily_report_freshness"
    description: "v2 研究日报当日新鲜度（PR #70 路径修复后业务盲区补强）"
    enabled: true
    check: "daily_report_freshness"
    params:
      max_lag_trading_days: 2
      # 落点解析与 cli._write_daily_research_report 完全一致：
      # 生产由 scheduled 运行写入 ${AQSP_RUNTIME_DATA_ROOT}/reports/daily_report.md；
      # 无持久 env（CI）时日报不存在 → 标记 skipped（与 stale_data 等约定一致）。
    severity: "critical"
