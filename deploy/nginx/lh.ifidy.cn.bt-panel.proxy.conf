# 角色与现状（务必先读，避免误以为这份在线上生效）：
#   - 本机实际加载的是 **Ubuntu 系统 nginx**（/etc/nginx/nginx.conf 只 include
#     conf.d/ 与 sites-enabled/），真正生效的是
#     /etc/nginx/conf.d/lh.ifidy.cn.conf = 本仓库
#     deploy/nginx/lh.ifidy.cn.system-nginx.conf（自包含版，已逐位核验一致）。
#   - 这份 BT 面板 vhost（/www/server/panel/vhost/nginx/lh.ifidy.cn.conf）
#     依赖 BT 专属 include（enable-php-00.conf、lua 版 well-known、
#     extension/proxy 目录），**从未被系统 nginx 加载** ⇒ 它当前是
#     "镜像源 / 规则基线"，不是线上真实链路。
#
# 双份同步约定（单一事实源原则）：
#   - 线上行为变更一律改 **system-nginx.conf**（仓库 + /etc/nginx/conf.d 同步），
#     改完 nginx -t && systemctl reload nginx。
#   - 若需改这份 BT proxy 规则（例如 BT 面板 UI 管理时），**必须同步回
#     system-nginx.conf**，否则改了 BT 这份而线上仍走系统 nginx，行为不变。
#   - 两份的 location 语义保持一致：/api/health、/api 精确、^~ /api/ 前缀、
#     ^~ /assets/、dashboard/beginner/agent/archive 302 收编、SPA 根。
# ============================================================================

# Vibe-Research candidate production entry. Include this file instead of
# aqsp-dashboard.conf; never include both because both define location /.

# Keep the backend health probe unauthenticated. The application itself
# intentionally exempts /api/health from VR_API_KEY checks.
location = /api/health {
    proxy_pass http://127.0.0.1:8900/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_cache off;
}

# Keep the prefix boundary explicit: /api belongs to FastAPI, while /apix does
# not accidentally become an API route.
location = /api {
    proxy_pass http://127.0.0.1:8900/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_cache off;
}

# API paths are preserved without a URI suffix rewrite. This keeps /api/*
# same-origin for React and allows FastAPI to enforce VR_API_KEY itself.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8900;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
}

# BaoTa serves the React build directly from the prepared site directory.
location ^~ /assets/ {
    root /opt/aqsp-releases/aqsp-scheduler-current/frontend/dist;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}

# Retire old AQSP dashboard, beginner and agent URLs explicitly. 302 is
# intentional during cutover: browsers do not pin the destination, so rollback
# remains possible without waiting for permanent-redirect caches to expire.
location ~ ^/(?:dist/)?dashboard(?:/|$|\.html$) {
    return 302 /$is_args$args;
}

location ~ ^/(?:beginner|agent|agents|dashboard_beginner)(?:/|$|\.html$|\.py$) {
    return 302 /$is_args$args;
}

location = /archive.html {
    return 302 /$is_args$args;
}

# React BrowserRouter routes use the prepared BaoTa site directory. API routes
# above remain on FastAPI and are not served from this directory.
location / {
    root /opt/aqsp-releases/aqsp-scheduler-current/frontend/dist;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
