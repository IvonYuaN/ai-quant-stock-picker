# AQSP 公网入口（lh.ifidy.cn）—— 系统 nginx 自包含版 vhost。
#
# 背景（2026-09-29 排查）：本机运行的是 Ubuntu 系统 nginx（/etc/nginx/nginx.conf
# 只 include conf.d/ 与 sites-enabled/），而 BT 面板生成的 vhost 躺在
# /www/server/panel/vhost/nginx/ 里从未被加载 ⇒ 80/443 无监听、域名解析正常但
# 连接被拒。BT vhost 依赖 BT 专属 include（enable-php-00.conf、lua 版 well-known），
# 无法直接喂给系统 nginx ⇒ 本文件是其**自包含实现**，忠实镜像维护中的反代规则
# （/www/server/panel/vhost/nginx/proxy/lh.ifidy.cn/*.conf）。
# 注意：BT 面板管理的是它自己那份 vhost；两份需人工保持同步（变更历史见仓库
# deploy/nginx/）。

server {
    listen 80;
    server_name lh.ifidy.cn;

    # ACME 证书续期验证路径（原生实现，替代 BT 的 lua 版 well-known）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/lh.ifidy.cn;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lh.ifidy.cn;

    ssl_certificate     /www/server/panel/vhost/cert/lh.ifidy.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/lh.ifidy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/lh.ifidy.cn.log;
    error_log  /www/wwwlogs/lh.ifidy.cn.error.log;

    # 敏感文件/目录一律 404（与 BT vhost 同口径）
    location ~* (\.(user\.ini|htaccess|htpasswd|env|log|sql|sqlite)|\.git|\.svn|\.ssh|node_modules|runtime/|pyproject\.toml|requirements\.txt) {
        return 404;
    }

    # ---- FastAPI（/api 归后端；VR_API_KEY 由应用自行校验）----
    location = /api/health {
        proxy_pass http://127.0.0.1:8900/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # /metrics 仅限内网监控用（127.0.0.1 直连 8900），公网一律 403
    location = /metrics {
        return 403;
    }

    # ---- React SPA（根指向当前 release；/assets/ 长缓存）----
    location ^~ /assets/ {
        root /opt/aqsp-releases/aqsp-scheduler-current/frontend/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 旧入口 302 收编（cutover 期间保留 302，便于回滚）
    location ~ ^/(?:dist/)?dashboard(?:/|$|\.html$) { return 302 /$is_args$args; }
    location ~ ^/(?:beginner|agent|agents|dashboard_beginner)(?:/|$|\.html$|\.py$) { return 302 /$is_args$args; }
    location = /archive.html { return 302 /$is_args$args; }

    location / {
        root /opt/aqsp-releases/aqsp-scheduler-current/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
