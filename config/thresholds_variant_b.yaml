# 示例配置：Variant B（激进配置）
version: "1.0.1"
effective_from: '2024-01-01'

composite:
  base_blend_weight: 0.7
  min_total_score: 0.40  # 更低的门槛
  momentum_weight: 0.35  # 增加动量权重
  quality_weight: 0.0
  regime_blend_weight: 0.3
  value_weight: 0.0
  volume_weight: 0.0
  mean_reversion_weight: 0.0
  triple_rise_weight: 0.35  # 增加三连阳权重

execution:
  commission_rate: 0.0003
  stamp_tax_rate: 0.001
  net_fee_mode: true
  slippage: 0.002

filter:
  max_price: 1000.0
  min_avg_volume: 1000000
  min_days_listed: 90
  min_price: 1.0

momentum:
  lookback_days: 90  # 更长的回看期
  ma_period: 20
  max_volatility: 0.3
  min_returns: 0.07  # 更高的收益要求
  rsi_overbought: 70
  rsi_oversold: 30
  trend_strength_threshold: 0.5
  weights:
    momentum: 0.4
    rsi: 0.3
    trend: 0.3

risk:
  single_stock_stop_pct: 0.10  # 更宽的止损
  portfolio_stop_pct: 0.15
  profit_take_threshold_pct: 0.20  # 更高的止盈目标
  max_positions: 8
  max_single_position_pct: 0.30

triple_rise:
  enabled: true
  lookback_days: 25
  avg_rise_strong: 0.04  # 更高的阈值
  avg_rise_medium: 0.025
  avg_rise_weak: 0.015
